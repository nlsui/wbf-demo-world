# Generated by world-building-framework 0.2.1 (`wbf init`).
# `npx wbf refresh` updates this file to the installed framework version, but
# only while you haven't edited it. Once you change it, it's yours to maintain.
name: Publish wiki

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the framework (version pinned in package.json)
        run: npm ci

      # Runs before publish so its base_url output (the Pages site's real
      # address) can be handed to Quartz.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Publish every build variant
        run: npx wbf publish --output ./site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
